# Netlify — deploy estático do CFT Study Companion.
#
# O que é publicado: somente o cliente (Vite → dist/public). O servidor
# Express/tRPC NÃO roda no Netlify; o tutor e o feedback de entrevistas
# funcionam em modo offline direto no navegador
# (shared/tutorFallback.ts), com os mesmos limites de segurança.
# Todo o progresso continua no localStorage, como no ambiente local.
#
# Publicar: conecte o repositório no Netlify (Build settings detectadas
# deste arquivo) ou use `netlify deploy --prod --dir dist/public`
# após `pnpm build:static` / `npm run build:static`.

[build]
  command = "pnpm build:static"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# SPA: qualquer rota serve o index (o app usa navegação interna).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache agressivo só para assets com hash; o HTML nunca é cacheado.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
